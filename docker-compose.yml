services:
  app:
    image: ${CHATGPT2API_IMAGE:-ghcr.io/yantianqi1/chatgpt2api:latest}
    pull_policy: always
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./data:/app/data
    environment:
      # 初始管理员账号；密码留空时首次启动会自动生成
      CHATGPT2API_ADMIN_USERNAME: ${CHATGPT2API_ADMIN_USERNAME:-admin}
      CHATGPT2API_ADMIN_PASSWORD: ${CHATGPT2API_ADMIN_PASSWORD:-}

      # 存储后端配置 (可选值: json, sqlite, postgres, git)
      STORAGE_BACKEND: ${STORAGE_BACKEND:-sqlite}
      
      # 数据库配置 (当 STORAGE_BACKEND=sqlite/postgres 时使用)
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/chatgpt2api.db}

      # 在线更新代理 (可选，未设置时复用 CHATGPT2API_PROXY)
      CHATGPT2API_UPDATE_PROXY_URL: ${CHATGPT2API_UPDATE_PROXY_URL:-}
